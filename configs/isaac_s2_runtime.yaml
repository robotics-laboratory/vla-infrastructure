revision: piper_x_isaac_s2_runtime_v1
status: implemented_awaiting_physical_quest_acceptance
extends: configs/isaac_s1_runtime.yaml
environment:
  isaac_lab_commit: 913ac53f51b2f8d02c9e121caa4cbdd06262948e
  isaac_lab_release: release/3.0.0
  isaac_lab_package_version: 16.4.0
  isaac_sim_version: 6.0.1.0
  isaacteleop_version: 1.4.98rc1
  isaaclab_teleop_version: 0.8.0
  cloudxr_runtime_version: 6.2.1
  dependency_source: Candidate B frozen uv.lock teleop extra
session:
  implementation: isaaclab_teleop IsaacTeleopDevice lifecycle with one S2 motion ControllersSource and no redundant anchor-hotkey ControllersSource
  cloudxr_profile: cloudxrjs
  use_kit_xr_bridge: true
  controller_source_count: 1
  source_outputs: [controller_left, controller_right]
  physical_gate_b_runtime_reused_semantically: one coherent session owns independent physical left and right streams
processor:
  revision: piper_x_isaac_s2_bimanual_relative_v1
  input_per_arm:
    pose_delta: [dx, dy, dz, rotation_vector_x, rotation_vector_y, rotation_vector_z]
    state: [controller_available, grip_pose_valid, squeeze_value, trigger_value]
  controller_pose: grip_pose
  frames:
    openxr: Y-up; +X right, +Y up, +Z back
    upstream_transform: world_T_anchor uses [x, y, z]_isaac = [x, -z, y]_openxr before the configured anchor pose
    output: Isaac world, Z-up, +X forward, +Y left
    arm_target: each Gate C base_link; both S1 base rotations are identity, so world spatial deltas have the same axes in each base
    tcp: Gate C gripper_base
  rotation:
    quaternion_order: xyzw
    handedness: right-handed
    relative_delta: R_current * inverse(R_previous)
    target_composition: left-multiply spatial delta onto the current TCP orientation
  translation_scale: 10.0
  rotation_scale: 10.0
  scale_source: NVIDIA Se3RetargeterConfig relative-mode defaults; exposed here for physical S2 confirmation
  upstream_smoothing: {alpha_position: 0.5, alpha_rotation: 0.5}
  upstream_deadband: {position_m_before_scale: 0.001, rotation_rad_before_scale: 0.01}
  clutch:
    control: squeeze_value greater than 0.5
    threshold: 0.5
    scope: independent per arm
    active_behavior: zero Cartesian delta while upstream continues updating its relative reference
    release_behavior: discard the first released delta and rebase; no target jump
  gripper:
    control: trigger_value greater than 0.5
    threshold: 0.5
    mode: binary
    open_aperture_m: 0.1
    closed_aperture_m: 0.0
    reset_aperture_m: 0.05
    mapping: trigger pressed closes; trigger released opens; independent per arm
  tracking:
    valid: controller present and grip_pose_valid with finite values
    invalid: emit zero delta, hold simulated target, and require a new reference
    recovery: discard the first newly valid delta per arm, then resume
    source_timestamp_threshold: null
  disconnect: hold simulated targets, mark both streams inactive, and require per-arm rebase on reconnect; never replay stale intent
  reset: reset S1 environment and upstream execution state, then require one newly valid rebase frame per arm
retargeting_ik:
  pose_delta: upstream isaacteleop Se3RelRetargeter
  ik: upstream Isaac Lab DifferentialIKController
  mode: relative pose
  method: damped least squares
  native_output: six Gate C arm joint position targets plus one Gate C aperture target per arm
  actuation: accepted S1 NativeBimanualTargets and articulation position-target path
cameras:
  implementation: unchanged accepted S1 upstream regex-batched Camera
  left_wrist: {width: 640, height: 480, dtype_layout: uint8 RGB HWC}
  right_wrist: {width: 640, height: 480, dtype_layout: uint8 RGB HWC}
