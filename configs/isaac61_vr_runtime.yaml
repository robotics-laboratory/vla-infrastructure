revision: piper_x_isaac_vr_runtime_v1
status: SELECTED_HUMAN_ACCEPTANCE_PENDING
extends_runtime: configs/isaac61_s2_runtime.yaml
rendering:
  physics_substeps_per_render: 4
  pattern: FFFT
  status: SELECTED_HUMAN_ACCEPTANCE_PENDING
  record_cameras: usd_prims_only_no_render_products
operator:
  stack: isaac61
  mode: run
  max_control_steps: 18000
  smoke_control_steps: 60
  stacks:
    isaac61: {preview_isolation: scene-partitions, preview_cameras: 3}
    legacy: {preview_isolation: "off", preview_cameras: 2}

cloudxr_web_client:
  url: https://nvidia.github.io/IsaacTeleop/client/release-1.4.x/
  release_series: 1.4.x
  operator_setup: Open the exact URL in the headset, select Isaac Lab, press Reset to defaults, then select the Quest 3 device profile before connecting.
  delivery: Operator-facing only; the browser client and its localStorage are not configured by the host launcher.

demo_physics:
  gripper_contact:
    status: SELECTED_HUMAN_ACCEPTANCE_PENDING
    canonical_geometry_change: none
    leader_joint: gripper
    leader_drive:
      effort_limit_n: 2.0
      velocity_limit_m_s: 3.0
      stiffness_n_m: 400.0
      damping_n_s_m: 40.0
    mimic_follower_joint_expr: gripper_joint[1-2]
    mimic_follower_drive:
      effort_limit_n: 1.0
      velocity_limit_m_s: 3.0
      stiffness_n_m: 0.0
      damping_n_s_m: 0.0
    rationale: The imported USD already constrains both fingers with NewtonMimicAPI. Only the geometry-free aperture leader is driven; duplicate high-gain follower drives caused contact-loop saturation and visible grasp oscillation.

scene:
  robot_bases_m:
    left: [0.233, 0.300, 0.825]
    right: [0.233, -0.300, 0.825]
  robot_base_rot_xyzw: [0.0, 0.0, 0.0, 1.0]
  base_separation_m: 0.600
  table:
    center_m: [0.725, 0.0, 0.775]
    size_m: [1.0, 1.0, 0.1]
    top_z_m: 0.825
    color_rgb: [0.53, 0.49, 0.43]
    static_friction: 0.8
    dynamic_friction: 0.6
  floor: {size_m: [6.0, 6.0], color_rgb: [0.12, 0.14, 0.16]}
  backdrop:
    center_m: [1.55, 0.0, 1.15]
    size_m: [0.06, 3.0, 2.3]
    color_rgb: [0.18, 0.21, 0.25]
    initial_visibility: true
    toggle_control: right_secondary_click
    quest_button: B
  lighting:
    dome: {intensity: 1700.0, color_rgb: [0.82, 0.86, 0.92]}
    key: {intensity: 2200.0, color_rgb: [1.0, 0.91, 0.78], angle_deg: 25.0}
  candidate_home_d0_per_arm:
    left: [-20.0, 90.0, -50.0, 0.0, 0.0, 0.0, 50.0]
    right: [20.0, 90.0, -50.0, 0.0, 0.0, 0.0, 50.0]
  home_policy: Selected VR homes require bounded collision/reachability smoke and physical qualification for changes.

profiles:
  default: dual_cube_to_matching_plates
  available: [dual_cube_to_matching_plates]
  dual_cube_to_matching_plates:
    left_cube: {position_m: [0.52, 0.17, 0.847], edge_m: 0.04, color_rgb: [0.10, 0.42, 0.92]}
    right_cube: {position_m: [0.52, -0.17, 0.847], edge_m: 0.04, color_rgb: [0.96, 0.36, 0.10]}
    left_plate: {position_m: [0.72, 0.17, 0.831], diameter_m: 0.14, thickness_m: 0.008, color_rgb: [0.10, 0.42, 0.92]}
    right_plate: {position_m: [0.72, -0.17, 0.831], diameter_m: 0.14, thickness_m: 0.008, color_rgb: [0.96, 0.36, 0.10]}

cameras:
  zed:
    checkout: /data/vla-infrastructure/assets/zed-isaac-sim
    revision: 0164268ca123fa4549fc9d2062c1fd55cf7996dc
    model: ZED_XONE_GS
    resolution: SVGA
    consumer: isaac_lab_authored_usd_sdk_free
    mount_physics: parented_massless_no_collision
  wrist:
    roles: [left_wrist, right_wrist]
    width: 960
    height: 600
    target_fps: 30.0
    # Isaac Lab's `world` camera convention uses local +X as forward and +Z as up.
    # Start from the PIPER gripper's +Z approach axis, roll the image 180 degrees,
    # then pitch the optical axis 3 degrees toward parent +X.
    # The gripper parent's +X axis points toward the underside in the working pose.
    # User-selected render F raises the camera to -6 cm on X and advances it
    # 1 cm along the gripper's +Z approach axis to reduce claw obstruction.
    offset_xyz_m: [-0.060, 0.0, 0.010]
    offset_quat_xyzw: [0.0, -0.688354575693754, 0.0, 0.7253743710122876]
    optical_axis_parent: +Z
    up_axis_parent: -X
    output_roll_deg: 180.0
    pitch_toward_gripper_deg: 3.0
    d0_contract_change: native_zed_svga_600x960
  scene:
    role: demo_scene
    eye_m: [0.10, 0.05, 1.43]
    target_m: [0.65, 0.0, 0.88]
    up: [0.0, 0.0, 1.0]
    width: 960
    height: 600
    target_fps: 30.0
    canonical_d0_input: true
    d0_key: observation.images.scene
    capture_boundary_revision: piper_x_three_camera_boundary_v1

xr_presentation:
  anchor_pos_m: [-0.05, 0.0, -0.10]
  anchor_rot_xyzw: [0.0, 0.0, -0.7071067811865475, 0.7071067811865476]
  near_plane_m: 0.10
  scale: 1.0
  rationale: Physical Quest evidence showed +1.20 m was far too low and -0.25 m was slightly too high. The selected VR anchor Z is now -0.10 m, lowering the unchanged table/robots by 0.15 m relative to the previous run; -90 degree world yaw still maps OpenXR forward to scene +X.
  recenter:
    execution_mode: sync
    motion_barrier: Hold the request frame; on the next control frame accept XRCore's current physical-to-world transform as the new reference and emit a zero-motion rebase. Any later transform change rebases again. Missing active XR transforms still hold motion.
    toggle_control: right_thumbstick_click
    quest_button: R3
    view_prim_path: /World/RobosynDemo/SceneCamera/base_link/ZED_XONE_GS/Camera
    behavior: One rising edge uses XRCore.schedule_teleport_to_view so the current physical HMD pose matches the validated demo scene-camera pose; controller poses use XRCore's full physical-to-virtual transform including the resulting space origin, while robot/table USD geometry and 1:1 scale remain unchanged.

teleop_tuning:
  sensitivity:
    control_mode: slider
    input_control: thumbstick_x
    quest_control: each controller's own horizontal thumbstick axis
    input_range: [-1.0, 1.0]
    scope: independent per arm
    slider:
      minimum: {translation_scale: 2.0, rotation_scale: 2.0}
      center: {translation_scale: 4.0, rotation_scale: 4.0}
      maximum: {translation_scale: 6.0, rotation_scale: 6.0}
    mapping: Piecewise linear and clamped; left is slower, center keeps the previous normal speed, right is faster.
    status: SELECTED_HUMAN_ACCEPTANCE_PENDING

vr_camera_feeds:
  implementation: upstream isaaclab_teleop XrCameraFeedSession and Kit SceneUI presenter
  image_source: Isaac Lab Camera RGBA buffer reused for presentation; sensor exclusion is owned by the optional RTX Scene Partition integration, not buffer selection.
  upload_path: cpu_staged
  panel_layout: Camera-resolution pixel layout; persistent head-locked and wall panels share camera buffers. Texture supersampling is 1.0.
  order: [left_wrist, demo_scene, right_wrist]
  layout_toggle_control: left_thumbstick_click
  layout_quest_button: L3
  initial_visibility: true
  toggle_control: left_primary_click
  quest_button: X
  semantics: RUN and DIAG start with previews visible; X changes upstream UiContainer visibility after one binding. Camera capture occurs after each FFFT group at simulation 30 Hz. Hidden preview callbacks skip acquisition, staging and upload. Visible panels publish fresh camera frames at most 30 Hz through ByteImageProvider.set_raw_bytes_data with retained CPU uint8 RGBA buffers and on-demand SceneUI capture. RECORD constructs only USD camera prims for offline RGB and never binds previews or creates dataset render products. Physical Quest verification remains pending.
  performance_mode: preview_uploads_optimized_ffft_renderer
  layout:
    mode: horizontal
    placement: head_locked
    # Upstream layout coordinates are horizontal/image-right and vertical/image-up.
    # Lower the previous head-locked row by 8 cm.
    center_offset_m: [0.0, 0.10]
    distance_m: 0.65
    panel_width_m: 0.36
    panel_gap_m: 0.035
    max_update_hz: 30.0
  wall_layout:
    mode: horizontal
    placement: world
    center_offset_m: [0.0, 0.0]
    # Wall front X=1.52; panels sit 2 cm in front, above the task.
    world_position_m: [1.50, 0.0, 1.72]
    # Image right=-Y, up=+Z, readable normal=-X toward the operator.
    world_orientation_xyzw: [0.5, -0.5, -0.5, 0.5]
    panel_width_m: 0.60
    panel_gap_m: 0.05

diagnostics:
  camera_capture_limit_per_feed: 12

recording_ui:
  enabled: true
  status: SELECTED_HUMAN_ACCEPTANCE_PENDING
  implementation: Kit XRSceneView + UiContainer + WidgetComponent; existing X/Y/B lifecycle input
  placement: head_locked
  distance_m: 0.75
  pixels_per_m: 1200.0
  feedback_seconds: 1.2
  layout:
    status: {width_m: 0.64, height_m: 0.06, offset_y_m: 0.23}
    review: {width_m: 0.60, height_m: 0.32, offset_y_m: -0.02}

validation:
  camera_max_stale_control_steps: 2
  camera_progression: Source-owned Camera.frame must advance within the bounded control-step tolerance; resets start a new epoch. No image-content-change requirement for static scenes.
  scene_partitions: Required on isaac61; sensor render products exclude XR panels, checked before rendering.
  settle_physics_steps: 120
  maximum_home_drift_deg: 1.0
  minimum_scene_rgb_stddev: 5.0
  profile_reset_position_tolerance_m: 0.005
  collision_smoke: PhysX contact reporting plus finite state and bounded settled joint drift; selected VR self-collisions enabled.
