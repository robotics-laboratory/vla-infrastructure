  - R1B
  - E1
  - E2
  - E3
  required_paths:
  - real_rollout.checkpoint_artifact_id
  - real_rollout.checkpoint_sha256
  - real_rollout.policy_config_artifact_id
  - real_rollout.preprocessor_artifact_id
  - real_rollout.postprocessor_artifact_id
  - real_rollout.task_id
  - real_rollout.task_revision
  - real_rollout.start_stop_procedure_artifact_id
  - real_rollout.authorization_evidence_id
  - real_rollout.accepted_command_log_artifact_id
  - real_rollout.result_artifact_id
  - execution_profiles.real_rollout.command
  - timing.policy_fps
  - timing.command_fps
  - timing.max_policy_action_age_ms
  - timing.inference.mode
  required_nonempty_paths: []
  required_evidence_kinds:
  - human_gate
  - run
  - hardware_observation
  required_artifact_kinds:
  - run_manifest
  - rollout_result
  - hardware_log
  - safety_report
  human_evidence_required: true
  hardware_evidence_required: true
  special_check: real_rollout
  mandatory_if: requirements.capabilities.real_rollout
  conditional_prerequisites:
    requirements.capabilities.hil:
    - HIL
B0:
  prerequisites:
  - S0
  required_paths:
  - benchmark.integration.raw_artifact_policy
  - benchmark.integration.profile_template
  - execution_profiles.benchmark_template.command
  required_nonempty_paths: []
  required_evidence_kinds:
  - document_review
  - command_test
  required_artifact_kinds:
  - benchmark_protocol
  - test_output
  mandatory_if: requirements.capabilities.benchmark_native_architecture
B1:
  prerequisites:
  - B0
  required_paths:
  - benchmark.selected
  required_nonempty_paths: []
  required_evidence_kinds:
  - run
  required_artifact_kinds:
  - run_manifest
  - eval_result
  - benchmark_protocol
  mandatory_if: requirements.capabilities.selected_benchmark
