cameras:
  wrist:
    roles: [left_wrist, right_wrist]
    width: 640
    height: 480
    target_fps: 30.0
    focal_length_mm: 18.0
    horizontal_aperture_mm: 20.955
    clipping_range_m: [0.02, 10.0]
    offset_xyz_m: [0.10, 0.0, 0.05]
    offset_quat_xyzw: [0.0, 0.0, 0.0, 1.0]
    d0_contract_change: none
  scene:
    role: demo_scene
    eye_m: [0.10, 0.05, 1.43]
    target_m: [0.65, 0.0, 0.88]
    up: [0.0, 0.0, 1.0]
    width: 640
    height: 480
    target_fps: 30.0
    horizontal_fov_deg: 60.0
    horizontal_aperture_mm: 20.955
    focal_length_mm: 18.147558
    clipping_range_m: [0.02, 10.0]
    canonical_d0_input: false

xr_presentation:
  anchor_pos_m: [-0.05, 0.0, -0.10]
  anchor_rot_xyzw: [0.0, 0.0, -0.7071067811865475, 0.7071067811865476]
  near_plane_m: 0.10
  scale: 1.0
  rationale: Physical Quest evidence showed +1.20 m was far too low and -0.25 m was slightly too high. The demo-only anchor Z is now -0.10 m, lowering the unchanged table/robots by 0.15 m relative to the previous run; -90 degree world yaw still maps OpenXR forward to scene +X.

teleop_tuning:
  sensitivity:
    initial_mode: normal
    toggle_control: left_secondary_click
    quest_button: Y
    toggle_threshold: 0.5
    scope: both arms receive the same edge-triggered left Y value
    modes:
      normal: {translation_scale: 4.0, rotation_scale: 4.0}
      precise: {translation_scale: 1.0, rotation_scale: 1.0}
    switch_behavior: One rising edge toggles both per-arm modes and emits zero Cartesian delta on the switching frame; holding does not retrigger.
    status: DEMO_ONLY_CANDIDATE_REQUIRES_PHYSICAL_RETEST

vr_camera_feeds:
  implementation: upstream isaaclab_teleop XrCameraFeedSession and Kit SceneUI presenter
  initial_visibility: false
  toggle_control: left_primary_click
  quest_button: X
  semantics: Display-only UiContainer show/hide after one upstream binding; both wrist cameras and the feed acquisition continue at 30 Hz while panels are hidden.
  performance_mode: not_implemented
  layout:
    mode: horizontal
    placement: head_locked
    center_offset_m: [0.0, -0.28]
    distance_m: 0.78
    panel_width_m: 0.28
    panel_gap_m: 0.035
    max_update_hz: 30.0

validation:
  settle_physics_steps: 120
  maximum_home_drift_deg: 1.0
  minimum_scene_rgb_stddev: 5.0
  profile_reset_position_tolerance_m: 0.005
  collision_smoke: PhysX contact reporting plus finite state and bounded settled joint drift; demo-only self-collisions enabled.
