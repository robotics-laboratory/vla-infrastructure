revision: piper_x_robosyn_vr_demo_v1
status: EXPERIMENTAL_TEST_ONLY_NOT_A_GATE
extends_runtime: configs/isaac_s2_runtime.yaml
base_checkpoint: 031143d576d923d6029d0226d963cbedaec1f6d4

environment:
  isaac_lab_commit: 913ac53f51b2f8d02c9e121caa4cbdd06262948e
  isaac_lab_package_version: 16.4.0
  isaac_sim_version: 6.0.1.0
  isaacteleop_version: 1.4.98rc1
  isaaclab_teleop_version: 0.8.0
  cloudxr_runtime_version: 6.2.1

demo_physics:
  gripper_contact:
    status: DEMO_ONLY_CONTACT_STABILITY_TUNING
    canonical_geometry_change: none
    leader_joint: gripper
    leader_drive:
      effort_limit_n: 2.0
      velocity_limit_m_s: 3.0
      stiffness_n_m: 400.0
      damping_n_s_m: 40.0
    mimic_follower_joint_expr: gripper_joint[1-2]
    mimic_follower_drive:
      effort_limit_n: 1.0
      velocity_limit_m_s: 3.0
      stiffness_n_m: 0.0
      damping_n_s_m: 0.0
    rationale: The imported USD already constrains both fingers with NewtonMimicAPI. Only the geometry-free aperture leader is driven; duplicate high-gain follower drives caused contact-loop saturation and visible grasp oscillation.

scene:
  robot_bases_m:
    left: [0.233, 0.300, 0.825]
    right: [0.233, -0.300, 0.825]
  robot_base_rot_xyzw: [0.0, 0.0, 0.0, 1.0]
  base_separation_m: 0.600
  table:
    center_m: [0.725, 0.0, 0.775]
    size_m: [1.0, 1.0, 0.1]
    top_z_m: 0.825
    color_rgb: [0.53, 0.49, 0.43]
    static_friction: 0.8
    dynamic_friction: 0.6
  floor: {size_m: [6.0, 6.0], color_rgb: [0.12, 0.14, 0.16]}
  backdrop:
    center_m: [1.55, 0.0, 1.15]
    size_m: [0.06, 3.0, 2.3]
    color_rgb: [0.18, 0.21, 0.25]
    initial_visibility: true
    toggle_control: right_secondary_click
    quest_button: B
  lighting:
    dome: {intensity: 1700.0, color_rgb: [0.82, 0.86, 0.92]}
    key: {intensity: 2200.0, color_rgb: [1.0, 0.91, 0.78], angle_deg: 25.0}
  candidate_home_d0_per_arm:
    left: [-20.0, 90.0, -50.0, 0.0, 0.0, 0.0, 50.0]
    right: [20.0, 90.0, -50.0, 0.0, 0.0, 0.0, 50.0]
  home_policy: Candidate homes are demo-only and may be replaced only after the bounded collision/reachability smoke.

profiles:
  default: dual_cube_to_matching_plates
  available: [dual_cube_to_matching_plates, robosyn_asset_lab]
  dual_cube_to_matching_plates:
    left_cube: {position_m: [0.52, 0.17, 0.847], edge_m: 0.04, color_rgb: [0.10, 0.42, 0.92]}
    right_cube: {position_m: [0.52, -0.17, 0.847], edge_m: 0.04, color_rgb: [0.96, 0.36, 0.10]}
    left_plate: {position_m: [0.72, 0.17, 0.831], diameter_m: 0.14, thickness_m: 0.008, color_rgb: [0.10, 0.42, 0.92]}
    right_plate: {position_m: [0.72, -0.17, 0.831], diameter_m: 0.14, thickness_m: 0.008, color_rgb: [0.96, 0.36, 0.10]}
  robosyn_asset_lab:
    manifest: configs/experiments/robosyn_test_assets.yaml
    placement_note: Sparse tabletop inspection profile; no per-asset environment and no production asset bank.

cameras:
  wrist:
    roles: [left_wrist, right_wrist]
    width: 640
    height: 480
    target_fps: 30.0
    focal_length_mm: 18.0
    horizontal_aperture_mm: 20.955
    clipping_range_m: [0.02, 10.0]
    # Isaac Lab's `world` camera convention uses local +X as forward and +Z as up.
    # Rotate those axes onto the PIPER gripper's +Z approach and +X upright axes.
    # The gripper parent's +X axis points toward the underside in the working pose.
    # The archived real-Kit sweep therefore mounts the camera 5.5 cm along -X:
    # it is physically above the gripper and leaves only a small claw edge in view.
    offset_xyz_m: [-0.055, 0.0, 0.0]
    offset_quat_xyzw: [0.7071067811865476, 0.0, 0.7071067811865476, 0.0]
    optical_axis_parent: +Z
    up_axis_parent: +X
    d0_contract_change: none
  scene:
    role: demo_scene
    eye_m: [0.10, 0.05, 1.43]
    target_m: [0.65, 0.0, 0.88]
    up: [0.0, 0.0, 1.0]
    width: 640
    height: 480
    target_fps: 30.0
    horizontal_fov_deg: 60.0
    horizontal_aperture_mm: 20.955
    focal_length_mm: 18.147558
    clipping_range_m: [0.02, 10.0]
    canonical_d0_input: false

xr_presentation:
  anchor_pos_m: [-0.05, 0.0, -0.10]
  anchor_rot_xyzw: [0.0, 0.0, -0.7071067811865475, 0.7071067811865476]
  near_plane_m: 0.10
  scale: 1.0
  rationale: Physical Quest evidence showed +1.20 m was far too low and -0.25 m was slightly too high. The demo-only anchor Z is now -0.10 m, lowering the unchanged table/robots by 0.15 m relative to the previous run; -90 degree world yaw still maps OpenXR forward to scene +X.
  recenter:
    execution_mode: sync
    motion_barrier: Hold the request frame; on the next control frame accept XRCore's current physical-to-world transform as the new reference and emit a zero-motion rebase. Any later transform change rebases again. Missing active XR transforms still hold motion.
    toggle_control: right_thumbstick_click
    quest_button: R3
    view_prim_path: /World/RobosynDemo/SceneCamera
    behavior: One rising edge uses XRCore.schedule_teleport_to_view so the current physical HMD pose matches the validated demo scene-camera pose; controller poses use XRCore's full physical-to-virtual transform including the resulting space origin, while robot/table USD geometry and 1:1 scale remain unchanged.

teleop_tuning:
  sensitivity:
    control_mode: slider
    input_control: thumbstick_x
    quest_control: each controller's own horizontal thumbstick axis
    input_range: [-1.0, 1.0]
    scope: independent per arm
    slider:
      minimum: {translation_scale: 2.0, rotation_scale: 2.0}
      center: {translation_scale: 4.0, rotation_scale: 4.0}
      maximum: {translation_scale: 6.0, rotation_scale: 6.0}
    mapping: Piecewise linear and clamped; left is slower, center keeps the previous normal speed, right is faster.
    status: DEMO_ONLY_CANDIDATE_REQUIRES_PHYSICAL_RETEST

vr_camera_feeds:
  implementation: upstream isaaclab_teleop XrCameraFeedSession and Kit SceneUI presenter
  image_source: Isaac Lab Camera RGBA buffer; do not attach the optional Kit post-update Replicator annotator because it can resample the XR panel composition and create recursive preview feedback.
  upload_path: cpu_staged
  panel_layout: Camera-resolution pixel layout; preserve upstream physical dimensions, labels and placement. Texture supersampling is 1.0.
  initial_visibility: false
  toggle_control: left_primary_click
  quest_button: X
  semantics: X changes upstream UiContainer visibility after one binding. Camera capture continues at configured simulation 30 Hz; hidden preview callbacks skip acquisition, staging and upload. Visible panels publish fresh camera frames at most 30 Hz through ByteImageProvider.set_raw_bytes_data with retained CPU uint8 RGBA buffers and on-demand SceneUI capture. Physics and renderer cadence are unchanged; panel visibility still requires physical Quest verification.
  performance_mode: preview_uploads_optimized_renderer_unchanged
  layout:
    mode: horizontal
    placement: head_locked
    # Upstream layout coordinates are horizontal/image-right and vertical/image-up.
    # With a ~0.31 m panel height, +0.18 m keeps the lower edge above eye center.
    center_offset_m: [0.0, 0.18]
    distance_m: 0.65
    panel_width_m: 0.36
    panel_gap_m: 0.035
    max_update_hz: 30.0

validation:
  settle_physics_steps: 120
  maximum_home_drift_deg: 1.0
  minimum_scene_rgb_stddev: 5.0
  profile_reset_position_tolerance_m: 0.005
  collision_smoke: PhysX contact reporting plus finite state and bounded settled joint drift; demo-only self-collisions enabled.
