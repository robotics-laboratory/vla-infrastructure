      stored_label_mutation_allowed: false
      send_action_return_semantics: LeRobot returns the action actually sent to motors, potentially clipped or modified; the PIPER-X plugin returns the SDK command after integer milli-unit round-trip, not hardware acceptance feedback, and record_loop does not store this return as dataset.action.
    device_accepted_command:
      observable_at_d0: false
      observation_source: null
      evidence_owner: R1 hardware evidence or the later simulator-native step result where observable.
      definitionally_equal_to_dataset_action: false
  processor_ownership:
    label_processors: Deterministic source_action to dataset_action transforms only; D0 selects upstream IdentityProcessorStep at the canonical RobotAction seam and later source gates must pin any source-specific steps without changing the output schema.
    policy_processors: LeRobot policy pre/postprocessor pipelines own model normalization, batching, device transfer, and any policy-specific rename; no policy or normalization is selected by D0.
    runtime_device_mapping: robot_action_processor plus Robot.send_action/env.step owns runtime units, native ordering, safety residuals, clipping, and device rounding after dataset_action.
    stateful_processors: []
    transform_classification:
      units_conversion: None in the D0 label processor; PIPER-X degree/millimeter to SDK integer milli-units belongs to runtime/device mapping.
      feature_rename_reorder: LeRobot feature aggregation/build_dataset_frame packs the explicit left-then-right name order into observation.state and action.
      normalization: None in canonical data semantics; only an explicit serialized LeRobot policy processor may normalize later.
      frame_mapping: None in canonical data semantics; source/runtime-specific controller or simulator mapping owns any frame transform.
      clipping: None in label semantics; runtime safety or device clipping is residual behavior and must not replace dataset.action.
      rounding: PIPER-X unit_to_milli integer rounding is runtime/device mapping; send_action return evidence is separate from the label.
      gripper_conversion: No label conversion; signed millimeter command and absolute millimeter observation are preserved, with SDK integer conversion only at send_action.
      left_right_composition: BiPiperXFollower owns deterministic left_ then right_ flat composition; LeRobot packs that declared order.
      camera_preprocessing: Runtime providers supply canonical uint8 RGB HWC frames; LeRobot video decoding deterministically exposes float32 RGB CHW in [0,1], with no D0 crop or resize.
  resampling:
    canonical_fps: 30
    grid: episode_relative_frame_index_div_fps
    exact_rate_behavior: One obs_t/source_action_t/dataset_action_t sample is accepted for each canonical tick.
    faster_source_behavior: Causally select the latest complete sample at or before each target tick and drop intervening samples.
    slower_source_behavior: Reject or abort the source episode/projection; do not synthesize missing canonical ticks.
    duplicate_policy: forbidden
    drop_policy: Only faster-source samples not selected by causal decimation may be dropped; canonical output ticks are never dropped silently.
    interpolation_policy: none
    causality_rule: No future sample may contribute to tick t; obs_t and dataset_action_t must retain the same source tick identity.
    recording_command_relationship: Pinned record_loop makes one send_action attempt per accepted dataset tick but this is not a separately guaranteed hardware command FPS; overrunning sources are rejected by the slower-source rule.
