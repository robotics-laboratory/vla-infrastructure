    exact_rate_behavior: One causally aligned obs_t/source_action_t/dataset_action_t bundle may be accepted for each canonical dataset tick after source age and cross-modal skew validation at that tick selection time.
    faster_source_behavior: In the common source clock, causally select the latest complete sample at or before the physical selection time for each target dataset tick and drop intervening samples.
    slower_source_behavior: Nominal source rate alone never rejects an episode. Reuse the latest causal sample only while its sequence, age, and cross-modal skew remain admissible; otherwise reject the tick and apply the declared source-path abort budget.
    duplicate_policy: A repeated source sequence is allowed only when explicitly represented in temporal metadata and still within freshness and skew limits; duplicate logical dataset timestamps remain forbidden.
    drop_policy: Unselected source samples and inadmissible canonical ticks may be dropped only with temporal QA accounting; accepted output ticks remain a dense LeRobot frame-index grid.
