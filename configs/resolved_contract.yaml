      - absolute_joint_position_command
      - signed_gripper_travel_command
      policy_role: training_target
      source_owner: Source-owned deterministic label output packed in canonical order; real uses LeRobot build_dataset_frame,
        Isaac converter binding remains pending.
      processor_chain:
      - lerobot.teleop_action_processor.IdentityProcessorStep
      - lerobot.aggregate_pipeline_dataset_features
      - lerobot.build_dataset_frame_float32
      derived: false
    runtime_mapping:
      owner: Runtime-owned mapping after the canonical dataset_action; real uses LeRobot robot_action_processor/Robot.send_action;
        Isaac native mapping is source-gate-owned.
      pipeline: lerobot.processor.RobotProcessorPipeline_then_Robot.send_action
      steps:
      - lerobot.processor.pipeline.IdentityProcessorStep
      - lerobot_robot_piperx.BiPiperXFollower.send_action_for_real_runtime
      - source_runtime_native_mapping_for_simulators_selected_later
      stored_label_mutation_allowed: false
      send_action_return_semantics: LeRobot returns the action actually sent to motors, potentially clipped or modified; the
        PIPER-X plugin first rejects partial/invalid arm actions and any command before motion_ready, validates and converts
        both bimanual sides before either SDK call, then returns the SDK command after integer milli-unit round-trip, not
        hardware acceptance feedback. record_loop does not store this return as dataset.action.
    device_accepted_command:
      observable_at_d0: false
      observation_source: null
      evidence_owner: R1 hardware evidence or the later simulator-native step result where observable.
      definitionally_equal_to_dataset_action: false
  processor_ownership:
    label_processors: Source-owned deterministic transforms to canonical float32[14] deg/mm before native clipping; real reuses
      LeRobot IdentityProcessorStep. Isaac runtime binding remains pending.
    policy_processors: LeRobot policy pre/postprocessor pipelines own model normalization, batching, device transfer, and
      any policy-specific rename; no policy or normalization is selected by D0.
    runtime_device_mapping: robot_action_processor plus Robot.send_action/env.step owns runtime units, native ordering, safety
      residuals, clipping, and device rounding after dataset_action.
    stateful_processors: []
    transform_classification:
      units_conversion: Real label seam already uses deg/mm; Isaac source label mapping must convert post-IK desired targets
        to canonical deg/mm before native clipping; binding pending D1.
      feature_rename_reorder: LeRobot feature aggregation/build_dataset_frame packs the explicit left-then-right name order
        into observation.state and action.
      normalization: None in canonical data semantics; only an explicit serialized LeRobot policy processor may normalize
        later.
      frame_mapping: None in canonical data semantics; source/runtime-specific controller or simulator mapping owns any frame
        transform.
      clipping: None in label semantics; runtime safety or device clipping is residual behavior and must not replace dataset.action.
      rounding: PIPER-X unit_to_milli integer rounding is runtime/device mapping; send_action return evidence is separate
        from the label.
      gripper_conversion: No label conversion; signed millimeter command and absolute millimeter observation are preserved,
        with SDK integer conversion only at send_action.
      left_right_composition: BiPiperXFollower owns deterministic left_ then right_ flat composition; LeRobot packs that declared
        order.
      camera_preprocessing: Runtime providers supply canonical uint8 RGB HWC frames; LeRobot video decoding deterministically
        exposes float32 RGB CHW in [0,1], with no D0 crop or resize.
  resampling:
    canonical_fps: 30
    grid: episode_relative_frame_index_div_fps
    exact_rate_behavior: One causally aligned three-camera obs_t/dataset_action_t transaction per accepted logical tick, validated
      by its declared source profile.
    faster_source_behavior: Select unique causal source identities; physical profiles additionally require acquisition no
      later than selection. Drop unselected intermediate samples.
    slower_source_behavior: No silent source reuse. Physical LeRobot compatibility requires each camera rate >= dataset_fps.
      Isaac capture barriers must supply each camera for the selected state generation.
    duplicate_policy: Reject repeated/regressing source identities and ticks; physical profiles also enforce source acquisition
      sequence/time monotonicity.
    drop_policy: Count rejection and abort pending transaction; do not persist inadmissible data. Physical pre-actuation failures
      still abort the upstream loop before send_action.
    interpolation_policy:
      camera: none
      joint_state: source_path_declared_causal
      xr_pose: source_path_declared_causal
      dataset_action: none
      command: lerobot_action_interpolator_when_configured
    causality_rule: No future sample may contribute to tick t; obs_t and dataset_action_t must retain the same source tick
      identity.
    recording_command_relationship: Pinned record_loop makes one send_action attempt per accepted dataset tick. Policy rollout
      command cadence is independent of dataset FPS and, when interpolation is configured, equals policy_fps multiplied by
      interpolation_multiplier.
