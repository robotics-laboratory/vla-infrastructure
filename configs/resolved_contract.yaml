      - right_joint_5.pos
      - right_joint_6.pos
      - right_gripper.pos
      units: [degree, degree, degree, degree, degree, degree, millimeter, degree, degree, degree, degree, degree, degree, millimeter]
      semantics: [absolute_joint_position_command, absolute_joint_position_command, absolute_joint_position_command, absolute_joint_position_command, absolute_joint_position_command, absolute_joint_position_command, signed_gripper_travel_command, absolute_joint_position_command, absolute_joint_position_command, absolute_joint_position_command, absolute_joint_position_command, absolute_joint_position_command, absolute_joint_position_command, signed_gripper_travel_command]
      policy_role: training_target
      source_owner: LeRobot teleop_action_processor output packed by build_dataset_frame using the ordered action names.
      processor_chain:
      - lerobot.teleop_action_processor.IdentityProcessorStep
      - lerobot.aggregate_pipeline_dataset_features
      - lerobot.build_dataset_frame_float32
      derived: false
    runtime_mapping:
      owner: Runtime-specific LeRobot robot_action_processor followed by Robot.send_action or env.step mapping.
      pipeline: lerobot.processor.RobotProcessorPipeline_then_Robot.send_action
      steps:
      - lerobot.processor.pipeline.IdentityProcessorStep
      - lerobot_robot_piperx.BiPiperXFollower.send_action_for_real_runtime
