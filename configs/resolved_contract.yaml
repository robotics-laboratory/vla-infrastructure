process_architecture:
  revision: piper_x_process_boundaries_v1
  same_process_lerobot_isaac_required: false
  generic_simulator_api_exists: false
  rpc_implementation_selected: false
  shared_semantic_boundary:
    gate: D0
    contract_revision: piper_x_d0_policy_data_v1
    schema_fingerprint_sha256: eb7e4613e5f8d0ff59039874555e6f2d73b728973e64cc01da8414e010d8d33d
  processes:
    core_lerobot:
      environment: core
      owns:
      - LeRobot 0.6.1 checkpoint loading
      - policy preprocessing and postprocessing
      - policy inference
      - lerobot-eval aggregation
      - evaluation manifests
      - seed-set selection
    isaac_native:
      environment: isaac
      owns:
      - Isaac application/runtime
      - PIPER-X environment, physics, rendering, and cameras
      - task and reset with seeded RNG application
      - D0/native processors
      - reward, success, termination, and truncation
      - native recording
  profile_ownership:
    offline_tests:
      execution_mode: single_process
      environments: [core]
    isaac_env:
      execution_mode: single_process
      environments: [isaac]
    isaac_vr_record:
      execution_mode: single_process
      environments: [isaac]
    isaac_generate:
      execution_mode: single_process
      environments: [isaac]
    isaac_dataset_convert:
      execution_mode: single_process
      environments: [core]
    isaac_eval:
      execution_mode: multi_process
      environments: [core, isaac]
    mujoco_env:
      execution_mode: single_process
      environments: [core]
    mujoco_eval:
      execution_mode: single_process
      environments: [core]
  eval_boundary:
    protocol_revision: piper_x_eval_boundary_v1
    semantics: synchronous_episode_sensitive
    transport_selection: deferred
    handshake_fields:
    - protocol_revision
    - D0_contract_fingerprint
    - environment_revision
    - PIPER_X_asset_model_revision
    - task_id
    - task_revision
    - processor_revision
    - horizon
    reset:
      request_fields: [run_id, episode_id, seed, task_id, task_revision]
      response_fields: [canonical_D0_obs_0, effective_seed]
    step:
      request_fields: [episode_id, step_index, canonical_D0_action_t]
      response_fields: [canonical_D0_obs_t_plus_1, reward_t, terminated_t, truncated_t, success_t, termination_reason]
    lifecycle_operations: [abort, close]
    health_state: minimal
    max_step_requests_in_flight: 1
    automatic_retry_after_ambiguous_timeout: false
    transport_failure_classification: infrastructure_failure
    transport_failure_is_task_truncation: false
    native_dictionaries_cross_boundary: false
    python_pickle_allowed: false
  control_boundary:
    implementation_state: deferred
    semantics: asynchronous_freshness_sensitive
    independent_of_eval: true
    transport_selection: deferred
    command_fields:
    - canonical_PIPER_X_command_semantics
    - sequence
    - source_timestamp
    - source_control_state
    observation_fields:
    - measured_canonical_observation_where_required
    - sim_timestamp
    - sequence
    - health_state
    stale_commands_dropped: true
    stale_commands_replayed: false
    native_fail_safe_owner: runtime_specific
    excluded_ownership: [reset, seeds, episode_metrics, recording, generation, asset_management]
