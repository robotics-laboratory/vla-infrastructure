    runtime_mapping:
      owner: Runtime-specific LeRobot robot_action_processor followed by Robot.send_action or env.step mapping.
      pipeline: lerobot.processor.RobotProcessorPipeline_then_Robot.send_action
      steps:
      - lerobot.processor.pipeline.IdentityProcessorStep
