  - gate: S0
    reason: upstream_bug
    summary: 'HISTORICAL / RESOLVED / NOT CURRENT RUNTIME — Reopened only the stale Isaac pin/environment evidence; Candidate B release/3.0.0 at 913ac53f passed exact runtime, Gate C articulation, native bimanual cameras, reset, and shutdown, so the affected S0 facts were amended and re-accepted.'
    evidence_ids:
    - gate_s0_isaac_upstream_audit
    - gate_s0_compatibility_probes
    - gate_s0_process_boundary_decision
  - gate: S0
    reason: unsupported_dependency
    summary: 'NARROW SCOPED DEPENDENCY AMENDMENT — Reopened only the ambiguous project-global Isaac Teleop dependency fact. Gate B/core retains isaacteleop 1.3.131 at 7002ed63, while Candidate B/Isaac uses its frozen supported isaacteleop 1.4.98rc1 and isaaclab_teleop 0.8.0 at 913ac53f; no runtime or process boundary changed.'
    evidence_ids:
    - gate_s0_candidate_b_teleop_dependency_audit
    - gate_s0_teleop_dependency_scope_review
  - gate: D0
    reason: contradiction
    summary: 'TEMPORAL CONTRACT V2 — Reopened D0 because logical LeRobot frame-grid time did not prove physical source freshness, nominal source rate was incorrectly coupled to dataset rate, and source age/cross-modal skew were not persisted. The v2 contract retains upstream recording, adds source-time metadata and independent rates, and re-accepts D0 with updated audit and regression evidence.'
    evidence_ids:
    - gate_d0_pinned_lerobot_audit
    - gate_d0_causality_regression
  - gate: A
    reason: safety_change
    summary: 'PIPER-X ADAPTER FAIL-CLOSED V3 — Reopened Gate A because the selected real adapter accepted SDK-initialized zero telemetry, ignored partial arm commands, tolerated enable timeout, and had non-transactional partial lifecycle behavior. Version 0.2.1 rejects these states and is re-accepted with an updated audit and focused fake-SDK regression evidence; no hardware gate is implied.'
    evidence_ids:
    - gate_a_piperx_adapter_hardening_review
    - gate_a_piperx_adapter_hardening_tests
