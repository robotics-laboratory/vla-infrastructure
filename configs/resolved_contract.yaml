environments:
  core:
    id: core
    purpose: LeRobot, real PIPER-X, MuJoCo, host Quest diagnostics, and offline tooling
    manager: uv
    python_version: CPython 3.12.13
    spec_artifact_id: core_uv_lock__other_0a0ed027
    torch_version: 2.7.1+cu126
    cuda_runtime: PyTorch bundled CUDA 12.6
    vendor_runtime: NVIDIA CloudXR 6.2.0 with auto-webrtc device profile for physical Quest work
    system_requirements:
    - native Linux
    - CloudXR runtime and EULA required only for physical Quest work
    canonical_launch_prefix: uv run
  isaac:
    id: isaac
    purpose: Isolated Isaac application/runtime for PIPER-X simulation, teleoperation, native recording, generation, and the Isaac endpoint side of E1; LeRobot is excluded
    manager: uv
    python_version: CPython 3.12.13
    spec_artifact_id: isaac1103_vr_environment
    torch_version: 2.11.0+cu128
    cuda_runtime: PyTorch bundled CUDA 12.8
    vendor_runtime: Isaac Sim6.1.0.0 / Kit110.3.0+feature.371399.00c488ae.gl / Lab sourceae37b028ea415c91ea2bc32609efcd759ed2b974; reproducible lock-only commit0c2e2c64e51922d088b695d72ffe03faa5c6b95d; teleop extra frozen.
    system_requirements:
    - Ubuntu22.04/24.04 x86_64; RTX4080+16GB VRAM;32GB RAM; SSD
    - Tested RTX4090 / driver580.159.03 / CUDA12.8
    - Each Linux account requires readable shared SDK/assets and private writable /data/<username>; port48322 exclusive
    - Six inherited upstream metadata overrides remain documented; required final S1/S2 machine paths pass; physical Quest S2 unresolved
    canonical_launch_prefix: UV_PROJECT_ENVIRONMENT=/data/vla-infrastructure/isaac61_production/env uv run --project /data/vla-infrastructure/isaac61_production/IsaacLab --frozen --no-sync --no-managed-python
  mujoco:
    id: mujoco
    purpose: Conceptual MuJoCo record mapped to the exact core environment; not a separate installation
    manager: uv
    python_version: CPython 3.12.13
    spec_artifact_id: core_uv_lock__other_0a0ed027
    torch_version: 2.7.1+cu126
    cuda_runtime: PyTorch bundled CUDA 12.6; MuJoCo itself does not require CUDA
    vendor_runtime: MuJoCo 3.9.0 canonical PyPI wheel with bundled MuJoCo library
    system_requirements:
    - same native Linux requirements as core
    - EGL is available for bounded headless camera rendering
    canonical_launch_prefix: uv run
  isaac_legacy:
    id: isaac_legacy
    purpose: Preserved exact accepted Isaac SDK for explicit --stack legacy rollback.
    manager: uv
    python_version: CPython 3.12.13
    spec_artifact_id: isaac_environment_selection__base_682ee936
    torch_version: 2.11.0+cu128
    cuda_runtime: PyTorch bundled CUDA 12.8
    vendor_runtime: Isaac Sim 6.0.1.0 with Isaac Lab release/3.0.0 at 913ac53f51b2f8d02c9e121caa4cbdd06262948e; exact upstream frozen workspace with documented overrides and the frozen S2 teleop extra activated
    system_requirements:
    - Ubuntu 22.04 or 24.04 x86_64
    - NVIDIA RTX 4080 or newer with at least 16 GB VRAM
    - at least 32 GB RAM and 50 GB SSD storage
    - Candidate B recommends Linux NVIDIA driver 580.95.05 or later; actual unchanged 580.159.03 satisfies the baseline and passed the qualified runtime
    - Candidate B upstream override-dependencies produce 11 retained uv/pip metadata conflicts; the expanded S1/S2 surfaces pass their automated required paths with no new conflict
    canonical_launch_prefix: uv run --project /data/vla-infrastructure/isaaclab_candidate_qualification/20260907/candidate_b_exact --frozen --no-sync
execution_profiles:
  offline_tests:
    environment: core
    working_directory: .
    command:
    - uv
    - run
    - pytest
    - -q
    prerequisites: []
  quest_xr_real:
    environment: core
    working_directory: .
    command:
    - uv
    - run
    - --group
    - isaac-teleop
    - python
    - tools/quest_xr_diagnostics.py
    - --no-auto-launch-cloudxr
    prerequisites:
    - NVIDIA CloudXR 6.2.0 is already running as one externally owned lifecycle
    - NV_DEVICE_PROFILE=auto-webrtc
    - Quest and host are connected over the NVIDIA CloudXR WebXR path
  real_dataset_record:
    environment: core
    working_directory: .
    command: null
    prerequisites: []
  real_rollout:
    environment: core
    working_directory: .
    command: null
    prerequisites: []
