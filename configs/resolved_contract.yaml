  - v43_candidate_matrix
  - v43_piper_x_support
  - v43_bimanual_support
  - v43_driver_firmware_behavior
  - v43_driver_model_crosscheck
  - v43_fork_vs_drop_in
  - v43_selected_plugin_seam
  - v43_track_1b_package_boundary
  - v43_lerobot_version_comparison
  - v43_driver_version_selection
  - v43_robot_contract_static_evidence
  - v43_gripper_static_evidence
  - v43_a_plugin_tests
  - v43_model_urdf
  - v43_quest_host_implementation
  - v43_quest_host_tests
  invalidated_evidence_ids:
  - v43_root_manifest_claim
  legacy_alias_map: {}
  reopen_records:
  - gate: S0
    reason: upstream_bug
    summary: HISTORICAL / RESOLVED / NOT CURRENT RUNTIME — Reopened only the stale Isaac pin/environment evidence; Candidate B release/3.0.0 at 913ac53f passed exact runtime, Gate C articulation, native bimanual cameras, reset, and shutdown, so the affected S0 facts were amended and re-accepted.
    evidence_ids:
    - gate_s0_isaac_upstream_audit
    - gate_s0_compatibility_probes
    - gate_s0_process_boundary_decision__other_0a0ed027
  - gate: S0
    reason: unsupported_dependency
    summary: NARROW SCOPED DEPENDENCY AMENDMENT — Reopened only the ambiguous project-global Isaac Teleop dependency fact. Gate B/core retains isaacteleop 1.3.131 at 7002ed63, while Candidate B/Isaac uses its frozen supported isaacteleop 1.4.98rc1 and isaaclab_teleop 0.8.0 at 913ac53f; no runtime or process boundary changed.
    evidence_ids:
    - gate_s0_candidate_b_teleop_dependency_audit__other_0a0ed027
    - gate_s0_teleop_dependency_scope_review
  - gate: D0
    reason: contradiction
    summary: TEMPORAL CONTRACT V3 — Reopened D0 because logical LeRobot frame-grid time did not prove physical source freshness, nominal source rate was incorrectly coupled to dataset rate, and source age/cross-modal skew were not persisted. The v3 contract retains upstream recording, requires source-owned acquisition identity, validates the exact bundle before actuation, forbids duplicate reuse, and re-accepts D0 with updated audit and regression evidence.
    evidence_ids:
    - gate_d0_pinned_lerobot_audit__other_0a0ed027
    - gate_d0_causality_regression__other_0a0ed027
  - gate: A
    reason: safety_change
    summary: PIPER-X ADAPTER FAIL-CLOSED V4 — Reopened Gate A because the selected real adapter accepted SDK-initialized zero telemetry, ignored partial arm commands, tolerated enable timeout, and had non-transactional partial lifecycle behavior. Version 0.2.2 rejects these states and additionally exposes atomic per-component CAN timing for the temporal recording boundary; no hardware gate is implied.
    evidence_ids:
    - gate_a_piperx_adapter_hardening_review
    - gate_a_piperx_adapter_hardening_tests
