process_architecture:
  revision: piper_x_process_boundaries_v4
  same_process_lerobot_isaac_required: false
  generic_simulator_api_exists: false
  rpc_implementation_selected: true
  shared_semantic_boundary:
    gate: D0
    contract_revision: piper_x_d0_policy_data_v4
    schema_fingerprint_sha256: 5926a9271f997202970f757738327593d22ed2ad2696c478cb69a75d35dd1ee1
  processes:
    core_lerobot:
      environment: core
      owns:
      - LeRobot 0.6.1 checkpoint loading
      - policy preprocessing and postprocessing
      - policy inference
      - lerobot-eval aggregation
      - evaluation manifests
      - seed-set selection
    isaac_native:
      environment: isaac
      owns:
      - Isaac application/runtime
      - PIPER-X environment, physics, rendering, and cameras
      - task and reset with seeded RNG application
      - D0/native processors
      - reward, success, termination, and truncation
      - native recording
  profile_ownership:
    offline_tests:
      execution_mode: single_process
      environments:
      - core
    isaac_env:
      execution_mode: single_process
      environments:
      - isaac
    isaac_vr:
      execution_mode: single_process
      environments:
      - isaac
    isaac_generate:
      execution_mode: single_process
      environments:
      - isaac
    isaac_dataset_convert:
      execution_mode: single_process
      environments:
      - core
    isaac_eval:
      execution_mode: multi_process
      environments:
      - core
      - isaac
    mujoco_env:
      execution_mode: single_process
      environments:
      - core
    mujoco_eval:
      execution_mode: single_process
      environments:
      - core
  eval_boundary:
    protocol_revision: piper_x_eval_boundary_v2
    semantics: synchronous_episode_sensitive
    transport_selection: unix_domain_socket_json_lines_v1
    handshake_fields:
    - protocol_revision
    - run_id
    - D0_contract_fingerprint
    - environment_revision
    - PIPER_X_asset_model_revision
    - task_id
    - task_revision
    - processor_revision
    - n_episodes
    - horizon
    handshake_response_fields:
    - run_id
    - endpoint_instance_id
    - accepted
    reset:
      request_fields:
      - run_id
      - request_id
      - episode_id
      - seed
      - task_id
      - task_revision
      response_fields:
      - request_id
      - canonical_D0_obs_0
      - effective_seed
    step:
      request_fields:
      - run_id
      - request_id
      - episode_id
      - step_index
      - canonical_D0_action_t
      response_fields:
      - request_id
      - canonical_D0_obs_t_plus_1
      - reward_t
      - terminated_t
      - truncated_t
      - success_t
      - termination_reason
    request_identity:
      field: request_id
      generation_owner: eval_client
      format: opaque_nonempty_string_unique_within_run
      required_operations:
      - reset
      - step
      - abort
      - close
      scope_fields:
      - run_id
      - request_id
      response_echo_required: true
      reuse_with_different_operation_or_payload: protocol_error_no_execution
    deduplication:
      owner: eval_runtime_endpoint
      key_fields:
      - run_id
      - request_id
      request_fingerprint: operation_plus_canonical_payload
      duplicate_same_fingerprint: return_cached_response_without_reexecution
      duplicate_different_fingerprint: protocol_error_no_execution
      survives_transport_reconnect: true
      survives_endpoint_restart: false
      endpoint_restart_behavior: invalidate_run_and_classify_infrastructure_failure
      retention: through_run_close_response
      capacity_bound: declared_n_episodes_times_horizon_plus_reset_abort_and_close_requests
      implementation_state: implemented
    lifecycle:
      abort:
        request_fields:
        - run_id
        - request_id
        - episode_id
        - reason
        response_fields:
        - request_id
        - abort_state
      close:
        request_fields:
        - run_id
        - request_id
        response_fields:
        - request_id
        - close_state
    lifecycle_operations:
    - abort
    - close
    health_state: minimal
    max_step_requests_in_flight: 1
    automatic_retry_after_ambiguous_timeout: false
    explicit_retry_after_ambiguous_timeout: same_request_id_only
    transport_failure_classification: infrastructure_failure
    transport_failure_is_task_truncation: false
    native_dictionaries_cross_boundary: false
    python_pickle_allowed: false
    implementation:
      endpoint: tools.isaac_eval_rpc.IsaacEvalEndpoint
      client: tools.isaac_eval_rpc.UnixEvalClient
      server: tools.isaac_eval_rpc.serve_unix_socket
      codec: utf8_json_lines_allow_nan_false
      isaac_entrypoint: tools/run_isaac_s1.py --eval-socket --eval-run-manifest
  control_boundary:
    implementation_state: deferred
    semantics: asynchronous_freshness_sensitive
    independent_of_eval: true
    transport_selection: deferred
    command_fields:
    - canonical_PIPER_X_command_semantics
    - sequence
    - source_timestamp
    - clock_domain
    - source_control_state
    observation_fields:
    - measured_canonical_observation_where_required
    - sequence
    - source_timestamp
    - clock_domain
    - age_ms
    - health_state
    stale_commands_dropped: true
    stale_commands_replayed: false
    native_fail_safe_owner: runtime_specific
    excluded_ownership:
    - reset
    - seeds
    - episode_metrics
    - recording
    - generation
    - asset_management
