    working_directory: .
    command: null
    prerequisites: []
  piper_motion:
    environment: core
    working_directory: .
    command: null
    prerequisites: []
  isaac_env:
    environment: isaac
    working_directory: .
    command:
    - python3
    - tools/launch_isaac_s1.py
    prerequisites:
    - OMNI_KIT_ACCEPT_EULA=Y after accepting the NVIDIA EULA
    - Final frozen isaac1103_environment SDK materialized under /data; execute from your ~/vla_infrastructure checkout; private /data/<username> state.
  isaac_vr:
    environment: isaac
    working_directory: .
    command:
    - ./run-vr
    prerequisites:
    - OMNI_KIT_ACCEPT_EULA=Y after accepting the NVIDIA EULA
    - Physical Meta Quest 3 CloudXR client is available for S2 human acceptance
    - This S2 command controls simulation only; state-only native recording is selected by isaac_vr_record and is not a D1 dataset
    - Final frozen isaac1103_environment SDK materialized under /data; execute from your ~/vla_infrastructure checkout; private /data/<username> state.
    - ISAACLAB_CXR_ACCEPT_EULA=1 after accepting CloudXR EULA; port48322 available or current-user existing runtime.
  isaac_vr_record:
    environment: isaac
    working_directory: .
    command:
    - ./run-vr
    - record
    prerequisites:
    - OMNI_KIT_ACCEPT_EULA=Y after accepting the NVIDIA EULA
    - ISAACLAB_CXR_ACCEPT_EULA=1 after accepting CloudXR EULA
    - Native HDF5 is state/action/provenance only; canonical RGB is materialized later by isaac_vr_replay
  isaac_vr_replay:
    environment: isaac
    working_directory: .
    command:
    - ./run-vr
    - replay
    prerequisites:
    - OMNI_KIT_ACCEPT_EULA=Y after accepting the NVIDIA EULA
  isaac_generate:
    environment: isaac
    working_directory: .
    command: null
    prerequisites: []
  isaac_dataset_convert:
    environment: core
    working_directory: .
    command: null
    prerequisites: []
  isaac_eval:
    environment: core
    working_directory: .
    command: null
    prerequisites:
    - Multi-process profile with a core LeRobot evaluator and isolated isaac native environment process
    - Local Unix-domain socket shared by the core evaluator and isolated Isaac endpoint
    - Per-run JSON handshake manifest supplied to tools/launch_isaac_s1.py --eval-run-manifest
    - Checkpoint, policy processors, run manifest, and result destinations remain run-owned E1 inputs
  mujoco_env:
    environment: core
    working_directory: .
    command: null
    prerequisites: []
  mujoco_eval:
    environment: core
    working_directory: .
    command: null
    prerequisites: []
  dataset_materialize:
    environment: core
    working_directory: .
