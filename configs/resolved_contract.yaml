  action_label_pipeline:
    source_action:
      owner: Current controller/source after its owned control solution emits the Gate A RobotAction mapping for obs_t.
      representation: Flat ordered RobotAction mapping in the accepted PIPER-X boundary units; no policy normalization.
      feature_names:
