spec_revision: piper_x_isaac_environment_selection_v1
status: selected_not_installed
acceptance_owner:
  selection: S0
  materialization_and_execution: S1
environment_id: isaac
purpose: Isolated NVIDIA Isaac application/runtime for PIPER-X simulation, rendering, teleoperation, native recording, generation, and the Isaac side of E1.
manager: uv
canonical_launch_prefix: uv run --project <pinned-isaaclab-checkout>
python:
  implementation: CPython
  version: 3.12.13
upstream:
  isaac_lab:
    repository: https://github.com/isaac-sim/IsaacLab
    tag: v3.0.0-beta2.patch1
    commit: ffff603eafc6b74264a5261cc0183d6a65390d78
    install_strategy: Exact source checkout using the release's uv/project metadata and NVIDIA source-package launcher.
  isaac_sim:
    distribution: isaacsim[all,extscache]
    version: 6.0.1.0
  isaac_teleop:
    repository: https://github.com/NVIDIA/IsaacTeleop
    version: 1.3.131
    commit: 7002ed63d69454ae4f15c0ee19f803fd2846592b
    scope: Required by the later S2/isaac_vr_record path; not required to execute S1.
pins:
  torch: 2.11.0+cu128
  torchvision: 0.26.0+cu128
  cuda_runtime: PyTorch CUDA 12.8
  gymnasium: 1.2.1
isolation:
  lerobot_installed: false
  core_packages_installed: false
  reason: The accepted LeRobot 0.6.1 and selected released Isaac stack have no supported same-process dependency solution.
reproduction_strategy:
- Check out the exact Isaac Lab tag and verify the commit.
- Create a dedicated CPython 3.12.13 environment outside core.
- Use the pinned release's source-package metadata, the Isaac Sim core package's exact torch/torchvision pins, and the NVIDIA launcher; do not add LeRobot and do not apply project dependency overrides.
- Retain the materialized lock, package inventory, NVIDIA compatibility-check output, and minimal launch output as S1 evidence.
- Treat any unresolved NVIDIA vendor-extra metadata conflict as an S1/S2 executable-environment blocker; do not rewrite this S0 selection artifact.
system_requirements:
  operating_system: Ubuntu 22.04 or 24.04 x86_64
  gpu_minimum: NVIDIA RTX 4080
  vram_minimum: 16 GB
  ram_minimum: 32 GB
  storage_minimum: 50 GB SSD
  nvidia_driver_published_tested: 595.58.03
host_observation_at_selection:
  nvidia_driver: 580.159.03
  driver_eligible: false
  target_filesystem_meets_storage_minimum: false
  classification: S1 executable environment blockers; not S0 audit/selection blockers.
transport:
  selected: false
  rpc_implementation: false
notes:
- This file is a reproducible selection manifest, not proof that Isaac is installed or runnable.
- S0 does not require installation under the live gate rules; S1 requires executable environment and parity evidence.
- Environment identity is independent of the core/Isaac process roles and the isaac_eval execution profile.
