[project]
name = "lerobot_robot_piperx"
version = "0.2.2"
description = "PIPER-X follower robots for LeRobot 0.6.1."
requires-python = "==3.12.13"
dependencies = [
    "lerobot==0.6.1",
    "piper-sdk==0.6.1",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_robot_piperx"]
