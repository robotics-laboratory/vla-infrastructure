[project]
name = "piper-x-quest3-integration-contract"
version = "0.0.0"
description = "Reproducible Session 0 environment for the PIPER-X + Quest 3 integration contract."
requires-python = "==3.10.*"
dependencies = [
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "ruff==0.15.4",
    "types-PyYAML==6.0.12.20250915",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv"]

[tool.mypy]
python_version = "3.10"
files = ["tools"]
exclude = ["^\\.venv/"]
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
disable_error_code = ["import-untyped"]
